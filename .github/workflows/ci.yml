name: Plugin quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  php-lint:
    name: PHP ${{ matrix.php }} lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.4']
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, gd
          coverage: none
      - name: Lint all PHP files
        run: find . -path './release' -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Check JavaScript syntax
        run: |
          find assets -name '*.js' -print0 | xargs -0 -n1 node --check
          node tests/report-autofill.test.cjs
          node tests/report-draft-recovery.test.cjs
          node tests/report-create-validation.test.cjs
          node tests/report-prepublish-review.test.cjs
          node tests/report-availability-preview.test.cjs
          node tests/setup-wizard-client.test.cjs

  wordpress-integration:
    name: WordPress activation smoke test
    runs-on: ubuntu-latest
    needs: php-lint
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: wordpress_test
          MYSQL_USER: wordpress
          MYSQL_PASSWORD: wordpress
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mysqli, gd
          coverage: none
      - name: Build and verify installable release archive
        run: |
          pwsh -File "$GITHUB_WORKSPACE/tools/build-release.ps1"
          plugin_version="$(node -p "require('./update-manifest.json').version")"
          plugin_archive="$GITHUB_WORKSPACE/release/$plugin_version/feuer-einsatzberichte-$plugin_version.zip"
          test -f "$plugin_archive"
          unzip -t "$plugin_archive"
          echo "FEU_PLUGIN_ARCHIVE=$plugin_archive" >> "$GITHUB_ENV"
      - name: Download WP-CLI and WordPress
        run: |
          curl -fsSL -o /usr/local/bin/wp https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x /usr/local/bin/wp
          wp core download --path="$RUNNER_TEMP/wordpress" --version=latest --force
      - name: Install isolated WordPress
        run: |
          wp config create --path="$RUNNER_TEMP/wordpress" --dbname=wordpress_test --dbuser=wordpress --dbpass=wordpress --dbhost=127.0.0.1 --skip-check --force
          wp core install --path="$RUNNER_TEMP/wordpress" --url=http://127.0.0.1:8089 --title='Plugin CI' --admin_user=admin --admin_password=password --admin_email=ci@example.test --skip-email
          wp rewrite structure '/%postname%/' --path="$RUNNER_TEMP/wordpress"
          unzip -q "$FEU_PLUGIN_ARCHIVE" -d "$RUNNER_TEMP/wordpress/wp-content/plugins"
      - name: Activate plugin and verify core services
        run: |
          wp plugin activate feuer-einsatzberichte --path="$RUNNER_TEMP/wordpress"
          test "$(wp eval 'echo !FEU_Einsatz_Report_Taxonomy::enabled() && !FEU_Einsatz_Template_Helpers::find_root_category() && 1 === (int) get_option("feu_einsatz_setup_fresh_install", 0) ? "1" : "0";' --path="$RUNNER_TEMP/wordpress")" = "1"
          wp eval-file "$GITHUB_WORKSPACE/tests/integration/setup-wizard-invalid.php" --path="$RUNNER_TEMP/wordpress"
          test "$(wp eval 'echo !FEU_Einsatz_Template_Helpers::find_root_category() && 1 === (int) get_option("feu_einsatz_setup_wizard_pending", 0) ? "1" : "0";' --path="$RUNNER_TEMP/wordpress")" = "1"
          wp eval-file "$GITHUB_WORKSPACE/tests/integration/setup-wizard.php" --path="$RUNNER_TEMP/wordpress"
          test "$(wp eval 'echo FEU_Einsatz_Report_Taxonomy::enabled() && count(FEU_Einsatz_Report_Taxonomy::get_selected_ids()) === 2 && count(get_terms(["taxonomy" => "category", "hide_empty" => false, "parent" => FEU_Einsatz_Template_Helpers::find_root_category()->term_id])) === 2 && 0 === (int) get_option("feu_einsatz_setup_wizard_pending", 1) ? "1" : "0";' --path="$RUNNER_TEMP/wordpress")" = "1"
          wp eval-file "$GITHUB_WORKSPACE/tests/integration/settings-save.php" --path="$RUNNER_TEMP/wordpress"
          test "$(wp option get feu_einsatz_area_station_name --path="$RUNNER_TEMP/wordpress")" = "Feuerwehr Akademie Hamburg"
          test "$(wp option get feu_einsatz_area_station_postcode --path="$RUNNER_TEMP/wordpress")" = "22113"
          test "$(wp eval 'echo count(FEU_Einsatz_Report_Taxonomy::get_selected_ids()) > 0 ? "1" : "0";' --path="$RUNNER_TEMP/wordpress")" = "1"
          wp option update feu_einsatz_stichwort_taxonomy_enabled 0 --path="$RUNNER_TEMP/wordpress"
          test "$(wp option get feu_einsatz_map_zoom --path="$RUNNER_TEMP/wordpress")" = "17"
          test "$(wp option get feu_einsatz_map_height --path="$RUNNER_TEMP/wordpress")" = "420"
          test "$(wp eval 'echo FEU_Einsatz_Admin::is_settings_tab_visible("sozial") ? "1" : "0";' --path="$RUNNER_TEMP/wordpress")" = "0"
          test "$(wp eval 'echo FEU_Einsatz_Admin::is_settings_tab_visible("module") ? "1" : "0";' --path="$RUNNER_TEMP/wordpress")" = "1"
          wp eval-file "$GITHUB_WORKSPACE/tests/integration/report-post-type.php" --path="$RUNNER_TEMP/wordpress"
          wp eval-file "$GITHUB_WORKSPACE/tests/integration/overview-performance.php" --path="$RUNNER_TEMP/wordpress"
          wp eval-file "$GITHUB_WORKSPACE/tests/integration/overview-pagination.php" --path="$RUNNER_TEMP/wordpress"
          wp eval-file "$GITHUB_WORKSPACE/tests/integration/report-migration.php" --path="$RUNNER_TEMP/wordpress"
          wp eval-file "$GITHUB_WORKSPACE/tests/integration/migration-overview.php" --path="$RUNNER_TEMP/wordpress"
          wp eval-file "$GITHUB_WORKSPACE/tests/integration/migration-diagnostics.php" --path="$RUNNER_TEMP/wordpress"
          wp eval-file "$GITHUB_WORKSPACE/tests/integration/report-edit.php" --path="$RUNNER_TEMP/wordpress"
          wp eval-file "$GITHUB_WORKSPACE/tests/integration/participant-summary.php" --path="$RUNNER_TEMP/wordpress"
          wp eval-file "$GITHUB_WORKSPACE/tests/integration/report-keywords.php" --path="$RUNNER_TEMP/wordpress"
          wp eval-file "$GITHUB_WORKSPACE/tests/integration/workflow-integrity.php" --path="$RUNNER_TEMP/wordpress"
          wp eval-file "$GITHUB_WORKSPACE/tests/integration/report-duplicate.php" --path="$RUNNER_TEMP/wordpress"
          wp eval-file "$GITHUB_WORKSPACE/tests/integration/plugin-load.php" --path="$RUNNER_TEMP/wordpress"
      - name: Verify public report routes over HTTP
        run: |
          wp eval-file "$GITHUB_WORKSPACE/tests/integration/report-http-fixtures.php" --path="$RUNNER_TEMP/wordpress"
          wp rewrite flush --path="$RUNNER_TEMP/wordpress"
          php -S 127.0.0.1:8089 -t "$RUNNER_TEMP/wordpress" > "$RUNNER_TEMP/report-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          sleep 2
          legacy_url='http://127.0.0.1:8089/einsaetze/http-route-ci-legacy/'
          category_url='http://127.0.0.1:8089/einsaetze/route-ci/http-route-ci-category/'
          for url in "$legacy_url" "$category_url"; do
            status="$(curl -sS -o "$RUNNER_TEMP/report-page.html" -w '%{http_code}' "$url")"
            echo "report-url=$url status=$status canonical-count=$(grep -Eoc 'rel=.canonical.' "$RUNNER_TEMP/report-page.html" || true)"
            test "$status" = '200'
            grep -q "<link rel=.[Cc]anonical.*$url" "$RUNNER_TEMP/report-page.html"
            test "$(grep -Eoc 'rel=.canonical.' "$RUNNER_TEMP/report-page.html")" = '1'
            grep -q 'property="og:title"' "$RUNNER_TEMP/report-page.html"
            grep -q 'name="description"' "$RUNNER_TEMP/report-page.html"
          done
          share_image_url="$(node -e 'const h=require("fs").readFileSync(process.argv[1],"utf8");const m=h.match(/<meta property="og:image" content="([^"]+)"/);process.stdout.write(m?m[1].replaceAll("&#038;","&").replaceAll("&amp;","&"):"")' "$RUNNER_TEMP/report-page.html")"
          echo "share-image-present=$([ -n "$share_image_url" ] && echo yes || echo no) image-route=$([ "${share_image_url#*admin-ajax.php}" != "$share_image_url" ] && echo ajax || echo other)"
          test -n "$share_image_url"
          case "$share_image_url" in *exp=*) exit 1;; esac
          case "$share_image_url" in *admin-ajax.php*) ;; *) exit 1;; esac
          image_status="$(curl -sS -D "$RUNNER_TEMP/report-share.headers" -o "$RUNNER_TEMP/report-share.png" -w '%{http_code}' "$share_image_url")"
          echo "share-image-status=$image_status type=$(file --brief --mime-type "$RUNNER_TEMP/report-share.png")"
          test "$image_status" = '200'
          test "$(file --brief --mime-type "$RUNNER_TEMP/report-share.png")" = 'image/png'
          ! grep -Eiq '^x-robots-tag:.*noindex' "$RUNNER_TEMP/report-share.headers"
          test "$(curl -sS -o /dev/null -w '%{http_code}' 'http://127.0.0.1:8089/einsaetze/wrong/http-route-ci-category/')" = '404'
          test "$(curl -sS -o /dev/null -w '%{http_code}' 'http://127.0.0.1:8089/einsaetze/http-route-ci-category/')" = '404'
          wp eval 'foreach (["http-route-ci-legacy", "http-route-ci-category"] as $slug) { $post = get_page_by_path($slug, OBJECT, "einsatzbericht"); if ($post) { wp_delete_post($post->ID, true); } }' --path="$RUNNER_TEMP/wordpress"
      - name: Build and restore Hamburg demo backup
        run: |
          node "$GITHUB_WORKSPACE/tools/build-demo-backup.mjs" "$RUNNER_TEMP/demo-backup/manifest.json"
          cd "$RUNNER_TEMP/demo-backup"
          zip -q "$RUNNER_TEMP/feuer-einsatzberichte-demo-backup.zip" manifest.json
          DEMO_BACKUP_PATH="$RUNNER_TEMP/feuer-einsatzberichte-demo-backup.zip" wp eval-file "$GITHUB_WORKSPACE/tests/integration/demo-backup.php" --path="$RUNNER_TEMP/wordpress"
